[package]
name = "oppen-desktop"
description = "oppen desktop shell: Tauri 2 host for the operator console and the in-process trading core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "oppen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oppen-core = { path = "../../../crates/oppen-core" }
oppen-hl = { path = "../../../crates/oppen-hl" }
oppen-mcp = { path = "../../../crates/oppen-mcp" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
