[package]
name = "oppen-hl"
description = "Hyperliquid protocol client: signing, info/exchange endpoints, websocket feeds, nonce allocation, order validation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
hex = "0.4"
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
rmp-serde = "1.3"
rust_decimal = { version = "1.43", default-features = false, features = ["std", "serde-with-str"] }
sha3 = { version = "0.11", default-features = false }
tokio.workspace = true
zeroize = "1"

[dev-dependencies]
rmp = "0.8"
serde_json = { workspace = true, features = ["preserve_order"] }
