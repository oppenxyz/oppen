[package]
name = "oppen-core"
description = "oppen core: append-only event ledger, guardrails, kill switch, alerts, agent journal, quant features"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
oppen-hl = { path = "../oppen-hl" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
hex = "0.4"
hmac = "0.13"
keyring = "4.2"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std", "serde-with-str", "maths"] }
sha3 = { version = "0.11", default-features = false }
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

# The keyring backend is chosen per platform: Keychain on macOS, Credential
# Manager on Windows, Secret Service on Linux. `docs/threat-model.md` names all
# three by name, so the feature set has to match what that document promises.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2", features = ["apple-native-keyring-store"] }

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "4.2", features = ["apple-native-keyring-store"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.2", features = ["windows-native-keyring-store"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.2", features = ["dbus-secret-service-keyring-store"] }
