[package]
name = "oppen-core"
description = "oppen core: append-only event ledger, guardrails, kill switch, alerts, agent journal, quant features"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
oppen-hl = { path = "../oppen-hl" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std", "serde-with-str"] }
sha3 = { version = "0.11", default-features = false }
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
