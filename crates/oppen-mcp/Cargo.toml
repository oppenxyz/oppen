[package]
name = "oppen-mcp"
description = "oppen MCP gateway: localhost HTTP server, agent pairing tokens, tool schemas, typed error taxonomy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
oppen-core = { path = "../oppen-core" }
oppen-hl = { path = "../oppen-hl" }
axum = "0.8"
getrandom = "0.2"
rmcp = { version = "3", features = ["server", "transport-streamable-http-server"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std", "serde-with-str"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
sha3 = { version = "0.11", default-features = false }
subtle = "2"
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util = "0.7"
tracing.workspace = true
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"
oppen-core = { path = "../oppen-core" }
tempfile = "3"
oppen-hl = { path = "../oppen-hl" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = "0.3"
