[workspace]
resolver = "2"
members = [
  "crates/oppen-hl",
  "crates/oppen-core",
  "crates/oppen-mcp",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gkssxf/oppen"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
strip = true
