name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: ".github/cla-signatures.json"
          path-to-document: "https://github.com/oppenxyz/oppen/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: gkssxf,dependabot[bot]
          custom-notsigned-prcomment: "Thanks for the contribution. Before we can merge, please sign the CLA by commenting exactly: **I have read the CLA Document and I hereby sign the CLA**"
