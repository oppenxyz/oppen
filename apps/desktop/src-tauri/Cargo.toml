[package]
name = "oppen-desktop"
description = "oppen desktop shell: Tauri 2 host for the operator console and the in-process trading core"
version.workspace = true
edition.workspace = true
# Not `license.workspace`: the shell is above the trusted computing base and is
# commercial, not Apache-2.0. Decisions L1 and L2 in docs/decisions.md.
license-file = "../LICENSE"
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "oppen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oppen-core = { path = "../../../crates/oppen-core" }
oppen-hl = { path = "../../../crates/oppen-hl" }
oppen-mcp = { path = "../../../crates/oppen-mcp" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
# Reuse oppen-hl's reqwest/rustls provider; do not enable a second provider.
tauri-plugin-updater = { version = "2", default-features = false }

tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# The live feed test drives a real socket, so it needs a runtime of its own.
# Tauri's `async_runtime` is tokio; this is the same one, not a second choice.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
