[workspace]
resolver = "2"
members = [
  "crates/oppen-hl",
  "crates/oppen-core",
  "crates/oppen-mcp",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Apache-2.0 covers the open core — `crates/*`, the trusted computing base.
# `apps/desktop` sits above that line and overrides this with `license-file`.
# The split and its reasoning are decisions L1 and L2 in docs/decisions.md.
license = "Apache-2.0"
repository = "https://github.com/gkssxf/oppen"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
strip = true
